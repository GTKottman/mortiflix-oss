<!doctype html><meta charset="utf-8"><title>Mortiflix Studio</title>
<body style="margin:0;height:100vh;display:grid;place-items:center;background:#0e0e10;color:#cfcfd4;font:16px system-ui,sans-serif">
<div style="text-align:center;max-width:32rem">
<p>Mortiflix Studio could not start its bridge on 127.0.0.1:4646.</p>
<p id="d" style="color:#8a8a93;font-size:14px"></p>
<button id="b" style="padding:.6rem 1.4rem;font-size:16px;border:1px solid #3a3a42;background:#1b1b20;color:#fff;border-radius:6px;cursor:pointer">Try again</button>
</div>
<script>
const q = new URLSearchParams(location.search); document.getElementById('d').textContent = q.get('why') || '';
document.getElementById('b').onclick = () => { document.getElementById('b').disabled = true;
  document.getElementById('b').textContent = 'Starting...'; window.__TAURI__.core.invoke('retry'); };
</script>
